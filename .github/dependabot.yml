# Dependabot v2 (ARCH-012 — Update-Disziplin).
# - pip: bewacht pyproject.toml-Dependencies (mcp, httpx, pydantic, structlog)
# - github-actions: hält actions/setup-python, checkout, pypa-publish aktuell
# - docker: bewacht das Dockerfile-Base-Image
#
# Monatlich, ein gebündelter PR pro Gruppe, max. 5 offene PRs pro Ecosystem —
# Rauschen niedrig halten, aber keine veraltete Lib übersehen.

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns:
          - "mcp*"
          - "httpx*"
          - "pydantic*"
          - "structlog*"
      dev:
        patterns:
          - "pytest*"
          - "respx*"
          - "ruff*"
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
